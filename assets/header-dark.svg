<svg xmlns="http://www.w3.org/2000/svg" width="880" height="130" viewBox="0 0 880 130" role="img" aria-label="Davi Lamounier — front-end e mobile">
  <style>
    :root { --ink: #E6EDF3; --muted: #8B949E; --rule: #30363D; --accent: #FF7A45; }
    .name { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 60px; font-weight: 600; letter-spacing: -1px; fill: var(--ink); }
    .dot  { fill: var(--accent); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 2px; fill: var(--muted); }
    .rule { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 880; stroke-dashoffset: 880; animation: draw 1s cubic-bezier(.6,0,.2,1) forwards; }
    .rise { opacity: 0; transform: translateY(8px); animation: rise .7s ease-out forwards; }
    .d2   { animation-delay: .4s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .rule { stroke-dashoffset: 0; animation: none; }
      .rise { opacity: 1; transform: none; animation: none; }
    }
  </style>

  <text class="name rise" x="-3" y="66">Davi Lamounier<tspan class="dot">.</tspan></text>
  <line class="rule" x1="0" y1="94" x2="880" y2="94"/>
  <text class="mono rise d2" x="0" y="120">FRONT-END &amp; MOBILE · BELO HORIZONTE</text>
</svg>
