<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Davi Lamounier — desenvolvedor front-end e mobile">
  <style>
    :root { --ink: #E6EDF3; --muted: #8B949E; --rule: #30363D; --accent: #FF7A45; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 2.2px; fill: var(--muted); }
    .name  { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 76px; font-weight: 600; letter-spacing: -1.5px; fill: var(--ink); }
    .dot   { fill: var(--accent); }
    .sub   { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 21px; font-style: italic; fill: var(--muted); }
    .rule  { stroke: var(--rule); stroke-width: 1; }
    .bar   { stroke: var(--accent); stroke-width: 3; }

    .draw  { stroke-dasharray: 880; stroke-dashoffset: 880; animation: draw 1.1s cubic-bezier(.6,0,.2,1) forwards; }
    .bar   { stroke-dasharray: 56; stroke-dashoffset: 56; animation: draw .5s ease-out 1.3s forwards; }
    .rise  { opacity: 0; transform: translateY(10px); animation: rise .8s ease-out forwards; }
    .d1 { animation-delay: .35s; } .d2 { animation-delay: .7s; } .d3 { animation-delay: 1.05s; }
    .dot   { animation: blink 1.4s steps(1) 2s 3; }

    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes rise  { to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .draw, .bar { stroke-dashoffset: 0; animation: none; }
      .rise { opacity: 1; transform: none; animation: none; }
      .dot  { animation: none; }
    }
  </style>

  <text class="mono" x="0" y="22">README · EDIÇÃO 2026</text>
  <text class="mono" x="880" y="22" text-anchor="end">BELO HORIZONTE, MG</text>
  <line class="rule draw" x1="0" y1="38" x2="880" y2="38"/>

  <text class="name rise d1" x="-4" y="128">Davi Lamounier<tspan class="dot">.</tspan></text>
  <text class="sub rise d2" x="0" y="168">Front-end &amp; mobile. Escrevo interfaces e, eventualmente, os testes delas.</text>

  <line class="rule draw" x1="0" y1="202" x2="880" y2="202" style="animation-delay:.2s"/>
  <line class="bar" x1="0" y1="202" x2="56" y2="202"/>
  <text class="mono rise d3" x="0" y="226">SQUADRA DIGITAL · COTEMIG · CIÊNCIA DA COMPUTAÇÃO</text>
  <text class="mono rise d3" x="880" y="226" text-anchor="end">P. 01</text>
</svg>
